<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MovieHub - Ratings</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header class="site-header">
        <nav id="main-navbar" class="navbar navbar-expand-lg navbar-dark bg-dark">
            <div class="container">
                <a class="navbar-brand fw-bold" href="index.html">MOVIEHUB</a>

                <button class="navbar-toggler" type="button"
                    data-bs-toggle="collapse" data-bs-target="#navbarNav">
                    <span class="navbar-toggler-icon"></span>
                </button>

                <div class="collapse navbar-collapse" id="navbarNav">
                    <ul class="navbar-nav ms-auto">
                        <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
                        <li class="nav-item"><a class="nav-link" href="movies.html">Catalog</a></li>
                        <li class="nav-item"><a class="nav-link active" href="ratings.html">Ratings</a></li>
                        <li class="nav-item"><a class="nav-link" href="trailers.html">Trailers</a></li>
                        <li class="nav-item"><a class="nav-link" href="reviews.html">Reviews</a></li>
                    </ul>
                </div>
            </div>
        </nav>
    </header>

    <main class="container py-5">

        <h2 class="mb-4 text-center">Movie Management</h2>

        <div class="d-flex justify-content-between align-items-center mb-4 flex-wrap gap-3">
            <p class="text-secondary mb-0">
                Manage your favorite movies and their ratings.
            </p>

            <button class="btn btn-red" id="addMovieBtn">
                + Add Movie
            </button>
        </div>

        <div id="movie-ratings-table" class="table-responsive shadow p-3">

            <table class="table table-hover align-middle">
                <thead>
                    <tr>
                        <th>Rank</th>
                        <th>Movie Title</th>
                        <th>Genre</th>
                        <th>Rating</th>
                        <th>Actions</th>
                    </tr>
                </thead>

                <tbody id="ratingsTableBody">
                </tbody>
            </table>

        </div>

        <div id="emptyMoviesMessage" class="alert alert-secondary mt-3" style="display: none;">
            No movies available. Add your first movie!
        </div>

        <p class="text-secondary mt-3" id="movieCount"></p>

    </main>

    <div class="modal fade" id="movieModal" tabindex="-1">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content bg-dark text-white">

                <div class="modal-header">
                    <h5 class="modal-title" id="movieModalTitle">Add Movie</h5>
                    <button type="button" class="btn-close btn-close-white"
                        data-bs-dismiss="modal"></button>
                </div>

                <div class="modal-body">

                    <form id="movieForm">

                        <div class="mb-3">
                            <label for="movieTitle" class="form-label">Movie Title</label>
                            <input type="text" class="form-control"
                                id="movieTitle" required minlength="2">
                        </div>

                        <div class="mb-3">
                            <label for="movieGenre" class="form-label">Genre</label>
                            <select class="form-select" id="movieGenre" required>
                                <option value="">Choose genre</option>
                                <option value="Action">Action</option>
                                <option value="Comedy">Comedy</option>
                                <option value="Horror">Horror</option>
                                <option value="Drama">Drama</option>
                                <option value="Romance">Romance</option>
                                <option value="Sci-Fi">Sci-Fi</option>
                                <option value="Crime">Crime</option>
                                <option value="Thriller">Thriller</option>
                            </select>
                        </div>

                        <div class="mb-3">
                            <label for="movieRating" class="form-label">Rating (0-10)</label>
                            <input type="number" class="form-control"
                                id="movieRating" min="0" max="10"
                                step="0.1" required>
                        </div>

                        <div class="text-end">
                            <button type="button" class="btn btn-secondary"
                                data-bs-dismiss="modal">Cancel</button>

                            <button type="submit" class="btn btn-red">
                                Save Movie
                            </button>
                        </div>

                    </form>

                </div>
            </div>
        </div>
    </div>

    <footer class="bg-dark text-white pb-4 pt-4">
        <div class="container text-center">
            <p>&copy; 2026 MovieHub.</p>
        </div>
    </footer>

    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/script.js"></script>

</body>
</html>
