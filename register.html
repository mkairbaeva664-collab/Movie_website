<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MovieHub - Registration</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="site-header">
        <nav id="main-navbar" class="navbar navbar-expand-lg navbar-dark bg-dark">
            <div class="container">
                <a class="navbar-brand fw-bold" href="index.html">MOVIEHUB</a>

                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                    <span class="navbar-toggler-icon"></span>
                </button>

                <div class="collapse navbar-collapse" id="navbarNav">
                    <ul class="navbar-nav ms-auto">
                        <li class="nav-item">
                            <a class="nav-link" href="index.html">Home</a>
                        </li>

                        <li class="nav-item">
                            <a class="nav-link" href="movies.html">Catalog</a>
                        </li>

                        <li class="nav-item">
                            <a class="nav-link" href="ratings.html">Ratings</a>
                        </li>

                        <li class="nav-item">
                            <a class="nav-link" href="trailers.html">Trailers</a>
                        </li>

                        <li class="nav-item">
                            <a class="nav-link" href="reviews.html">Reviews</a>
                        </li>

                        <li class="nav-item">
                            <a class="nav-link active" href="register.html">Register</a>
                        </li>
                    </ul>
                </div>
            </div>
        </nav>
    </header>

    <main class="container py-5">
        <section class="registration-section mx-auto">
            <div class="text-center mb-4">
                <h1>Join MovieHub</h1>
                <p>Create an account and become part of our movie community!</p>
            </div>

            <form id="registrationForm" novalidate>
                <div class="mb-3">
                    <label for="name" class="form-label">Full Name</label>
                    <input type="text" class="form-control" id="name" placeholder="Enter your full name">
                    <small id="nameError" class="error-message"></small>
                </div>

                <div class="mb-3">
                    <label for="email" class="form-label">Email Address</label>
                    <input type="text" class="form-control" id="email" placeholder="Enter your email">
                    <small id="emailError" class="error-message"></small>
                </div>

                <div class="mb-3">
                    <label for="password" class="form-label">Password</label>
                    <input type="password" class="form-control" id="password" placeholder="Create a password">

                    <div id="passwordStrength" class="password-strength mt-2">Password strength: Not entered</div>

                    <small id="passwordError" class="error-message"></small>
                </div>

                <div class="mb-3">
                    <label for="confirmPassword" class="form-label">Confirm Password</label>
                    <input type="password" class="form-control" id="confirmPassword" placeholder="Repeat your password">
                    <small id="confirmPasswordError" class="error-message"></small>
                </div>

                <div class="mb-3">
                    <label for="message" class="form-label">Message</label>

                    <textarea class="form-control" id="message" rows="3" placeholder="Why do you love movies?"></textarea>
                    <small id="messageError" class="error-message"></small>
                </div>

                <div class="text-center mt-4">
                    <button type="submit" class="btn btn-red btn-lg">Create Account</button>
                </div>

                <div id="formMessage" class="mt-3 text-center" role="status" aria-live="polite"></div>
            </form>
        </section>
    </main>

    <footer class="bg-dark text-white pb-4 pt-4">
        <div class="container text-center">
            <p>&copy; 2026 MovieHub</p>

            <div>
                <a href="#" class="text-white mx-2">GitHub</a>
                <a href="#" class="text-white mx-2">Instagram</a>
            </div>
        </div>
    </footer>

    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/script.js"></script>

</body>
</html>
